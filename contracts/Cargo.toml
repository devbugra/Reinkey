[workspace]
resolver = "2"
members = ["channel", "reinkey-account", "credit-pool"]

[workspace.dependencies]
soroban-sdk = { version = "28.0.0", features = ["hazmat-address"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
